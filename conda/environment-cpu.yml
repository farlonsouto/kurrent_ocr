name: kurrent
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - cpuonly          # Explicitly instructs Conda to use CPU-only versions
  - pip
  - pip:
      - transformers
      - fastapi
      - uvicorn
      - python-multipart
      - opencv-python-headless
      - safetensors
      - sentencepiece   # Required for TrOCR tokenization
      - accelerate      # Required for efficient model loading/dispatch
      - pillow          # Essential for processing Archion scans
